<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          --bg: #0a0a0a;
          --glow: #1b1b2e;
          --ink: #f4f4f5;
          --accent: #7c5cff;
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: radial-gradient(ellipse 60% 55% at 50% 50%, var(--glow) 0%, var(--bg) 70%);
          font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }
        #content {
          width: 100%;
          height: 100%;
        }
        #drift {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          padding: 120px 160px;
          gap: 36px;
        }
        .headline {
          display: flex;
          gap: 0.28em;
          color: var(--ink);
          font-size: 190px;
          font-weight: 700;
          letter-spacing: -0.045em;
          line-height: 1.05;
        }
        .mask {
          display: inline-block;
          overflow: hidden;
          padding: 0 0.04em 0.14em;
        }
        .word {
          display: inline-block;
        }
        .word.accent {
          color: var(--accent);
        }
        #rule {
          width: 420px;
          height: 6px;
          border-radius: 3px;
          background: var(--accent);
          transform-origin: left center;
        }
      </style>

      <div id="root" data-composition-id="title-card" data-width="1920" data-height="1080">
        <div id="content">
          <div id="drift">
            <h1 class="headline">
              <span class="mask" data-layout-allow-overflow="true"><span class="word" id="w-hello">Hello</span></span>
              <span class="mask" data-layout-allow-overflow="true"><span class="word accent" id="w-world">world</span></span>
            </h1>
            <div id="rule"></div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Hook: words rise out of their masks
        tl.fromTo("#w-hello", { yPercent: 110 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0.3);
        tl.fromTo("#w-world", { yPercent: 110 }, { yPercent: 0, duration: 0.9, ease: "expo.out" }, 0.5);

        // Punch: accent rule draws under the title
        tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 1.2);

        // Hold: slow push-in keeps the frame alive
        tl.fromTo("#drift", { scale: 1 }, { scale: 1.04, duration: 4.4, ease: "sine.inOut" }, 0.3);

        // Resolve: soft exit on the final beat
        tl.fromTo(
          "#content",
          { autoAlpha: 1, filter: "blur(0px)" },
          { autoAlpha: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" },
          4.5,
        );

        // Pad timeline to the full 5s slot
        tl.to({}, { duration: 5 }, 0);

        window.__timelines["title-card"] = tl;
      </script>
    </template>
  </body>
</html>
