<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #EEF1FF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-immortal"
        class="scene"
        data-composition-id="01-immortal"
        data-composition-src="compositions/frames/01-immortal.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-rewind"
        class="scene"
        data-composition-id="02-rewind"
        data-composition-src="compositions/frames/02-rewind.html"
        data-start="4"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-name"
        class="scene"
        data-composition-id="03-name"
        data-composition-src="compositions/frames/03-name.html"
        data-start="8.5"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-atoms"
        class="scene"
        data-composition-id="04-atoms"
        data-composition-src="compositions/frames/04-atoms.html"
        data-start="11.5"
        data-duration="4.9"
        data-track-index="1"
      ></div>

      <div
        id="el-05-forever"
        class="scene"
        data-composition-id="05-forever"
        data-composition-src="compositions/frames/05-forever.html"

      ></div>

      <div
        id="el-06-lives"
        class="scene"
        data-composition-id="06-lives"

      ></div>

      <div
        id="el-07-os"
        class="scene"

      <div
        id="el-08-lockup"

      <div
        id="el-09-swim-away"
        class="scene"
        data-composition-id="09-swim-away"

        data-track-index="0"
      ></div>

      <video id="f08-sting" src="assets/dorni-jellyfish-sting.mp4" data-media-start="6" muted playsinline
        class="clip"
        style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;object-fit:cover"
        data-start="27.5"
        data-duration="4.5"
        data-track-index="8002"
      ></video>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-immortal", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-rewind", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-02-rewind", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 8.5);
        tl.fromTo("#el-03-name", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 8.5);
        tl.to("#el-03-name", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 11.5);
        tl.fromTo("#el-04-atoms", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 11.5);
        tl.to("#el-04-atoms", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 16);
        tl.fromTo("#el-05-forever", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 16);
        tl.to("#el-05-forever", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.fromTo("#el-06-lives", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19.5);
        tl.to("#el-06-lives", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-07-os", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-07-os", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 27.5);
        tl.fromTo("#el-08-lockup", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 27.5);
        tl.to({}, { duration: 40 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
